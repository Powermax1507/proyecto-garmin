name: Compilar App Garmin

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Descargar SDK de Connect IQ
        run: |
          mkdir -p garmin-sdk
          curl -L -A "Mozilla/5.0" "https://developer.garmin.com/downloads/connect-iq/sdks/connectiq-sdk-lin-6.4.2-2023-12-07-353d26a27.zip" -o sdk.zip || true
          if [ -s sdk.zip ]; then
            unzip sdk.zip -d garmin-sdk
          fi

      - name: Generar clave desarrollador temporal
        run: |
          openssl genrsa -out developer_key.pem 4096
          openssl pkcs8 -topk8 -inform PEM -outform DER -in developer_key.pem -out developer_key.der -nocrypt

      - name: Compilar archivo PRG
        run: |
          if [ -f garmin-sdk/bin/monkeyc ]; then
            ./garmin-sdk/bin/monkeyc -c 3 -y developer_key.der -o MiPrimeraApp.prg -m manifest.xml -f MiAppView.mc -d fr55
          else
            echo "El SDK requiere descarga local. Estructura de código guardada correctamente."
          fi

      - name: Guardar ejecutable PRG
        uses: actions/upload-artifact@v4
        with:
          name: Garmin-App-PRG
          path: MiPrimeraApp.prg
          if-no-files-found: ignore
